<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">PneuRelief implementation architecture</title>
  <desc id="desc">A BLE pressure sensor sends GATT notifications to a React Native and Expo mobile app, with a FastAPI backend. TypeScript decodes Base64 and CSV sensor data. The app handles Android permissions, device commands and reconnection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28705b"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="#f4f7ed"/>
  <path d="M80 192H1520" stroke="#c4d9c4" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173f2e">
    <text x="80" y="80" font-size="21" letter-spacing="3" fill="#56745c">IMPLEMENTATION DIAGRAM</text>
    <text x="80" y="146" font-size="56" font-weight="700">PneuRelief</text>
    <text x="1520" y="140" font-size="25" text-anchor="end" fill="#56745c">Cast-pressure monitoring</text>
    <rect x="80" y="292" width="370" height="294" rx="24" fill="#e3efc6" stroke="#bbd0a3" stroke-width="2"/>
    <rect x="615" y="292" width="370" height="294" rx="24" fill="#d3ebdf" stroke="#a7cebc" stroke-width="2"/>
    <rect x="1150" y="292" width="370" height="294" rx="24" fill="#f4e3da" stroke="#ddc3b6" stroke-width="2"/>
    <text x="116" y="350" font-size="21" letter-spacing="2" fill="#56745c">DEVICE</text>
    <text x="116" y="417" font-size="40" font-weight="700">BLE sensor</text>
    <text x="116" y="467" font-size="25">Cast-pressure data</text>
    <text x="116" y="539" font-size="23" fill="#56745c">GATT notifications</text>
    <text x="651" y="350" font-size="21" letter-spacing="2" fill="#56745c">MOBILE</text>
    <text x="651" y="417" font-size="40" font-weight="700">React Native</text>
    <text x="651" y="467" font-size="25">Expo + TypeScript</text>
    <text x="651" y="539" font-size="23" fill="#56745c">Decode Base64 / CSV</text>
    <text x="1186" y="350" font-size="21" letter-spacing="2" fill="#56745c">BACKEND</text>
    <text x="1186" y="417" font-size="40" font-weight="700">FastAPI</text>
    <text x="1186" y="467" font-size="25">Application backend</text>
    <path d="M470 438H592" stroke="#28705b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1005 438H1127" stroke="#28705b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="80" y="664" width="1440" height="160" rx="20" fill="#fffdf5" stroke="#d7decc" stroke-width="2"/>
    <text x="116" y="716" font-size="21" letter-spacing="2" fill="#56745c">CONNECTION HANDLING</text>
    <text x="116" y="775" font-size="29">Android permissions</text>
    <text x="670" y="775" font-size="29">Device commands</text>
    <text x="1195" y="775" font-size="29">Reconnection</text>
    <text x="80" y="894" font-size="21" fill="#56745c">Sensor readings, device connection and pressure monitoring.</text>
  </g>
</svg>
